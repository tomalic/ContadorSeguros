<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Recuento Seguros</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4a7c2b" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="logo-192-v1.png">
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --verde-claro: #a6d96a;
      --verde-oscuro: #4a7c2b;
      --naranja-claro: #ffd08a;
      --naranja-oscuro: #d98b00;
      --amarillo-claro: #ffe18a;
      --amarillo-oscuro: #cfa12a;
      --rojo: #e4573d;
      --gris-fondo: #f5f5f5;

      /* colores fondo según objetivo */
      --fondo-verde:   #d8f5d1; /* objetivo > 3 */
      --fondo-naranja: #ffe7c0; /* 0 a 3 */
      --fondo-rosado:  #ffd6d6; /* ≤ 0 */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: var(--gris-fondo);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--fondo-verde); /* valor por defecto, luego JS lo actualiza */
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      transition: background-color 0.25s ease;
    }

    .title {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 18px;
      border: 3px solid black;
      border-radius: 999px;
      padding: 10px;
      background: #fff;
    }

    /* ---- BOTÓN PRINCIPAL PRESENTADO ---- */
    .presentado-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .presentado-wrapper {
      display: flex;
      align-items: center;
    }

    .minus-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--amarillo-claro), var(--amarillo-oscuro));
      border: 4px solid var(--verde-oscuro);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      user-select: none;
      margin-right: -18px;
      z-index: 1;
      transition: transform 0.1s ease;
      background-clip: padding-box;
    }

    .minus-btn:active { transform: scale(0.95); }

    .presentado-btn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #c8f28e, var(--verde-claro));
      border: 5px solid var(--verde-oscuro);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0,0,0,0.18);
      transition: transform 0.1s ease;
    }

    .presentado-btn:active { transform: scale(0.95); }

    .presentado-btn .count {
      font-size: 2.4rem;
      font-weight: 700;
    }

    .presentado-btn .label {
      font-size: 1.1rem;
      margin-top: 4px;
    }

    /* ---- RESTO DE BOTONES ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .button-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .button-row {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .small-minus {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--amarillo-claro), var(--amarillo-oscuro));
      border: 4px solid var(--verde-oscuro);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      margin-right: -16px;
      z-index: 1;
      box-shadow: 0 3px 8px rgba(0,0,0,0.18);
      transition: transform 0.1s ease;
      background-clip: padding-box;
    }

    .small-minus:active { transform: scale(0.95); }

    .circle-btn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--naranja-claro), var(--naranja-oscuro));
      border: 4px solid var(--naranja-oscuro);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.16);
    }

    .circle-btn:active { transform: scale(0.95); }

    .circle-btn .count {
      font-size: 2rem;
      font-weight: 600;
    }

    .label { font-size: 0.85rem; text-align: center; }

    /* ---- BOTÓN BORRAR ---- */
    .actions-row {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .clear-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      background: radial-gradient(circle at 30% 30%, #ff8b6b, var(--rojo));
      border: 4px solid #a12a1a;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.1s ease;
    }

    .clear-btn:active { transform: scale(0.95); }

    /* ---- TOTALES ---- */
    .totals {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 18px;
      background: #ffffffd8;
      border-radius: 16px;
      padding: 10px 12px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
    }

    .total-box {
      min-width: 120px;
      padding: 8px;
      font-size: 1.2rem;
      text-align: center;
      font-weight: 700;
      border-radius: 999px;
      border: 3px solid black;
      background: #fff;
    }

    #objetivo-box.ok { color: #0a7c0a; border-color: #0a7c0a; }
    #objetivo-box.bad { color: #b00020; border-color: #b00020; }

    /* ---- RESUMEN DIARIO ---- */
    .daily-section {
      margin-top: 8px;
      background: #ffffffd8;
      border-radius: 16px;
      padding: 8px 10px 10px;
    }

    .daily-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .month-label { font-weight: 600; }

    .export-btn {
      border-radius: 999px;
      border: 1px solid #222;
      padding: 4px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      background: #f0f0f0;
    }

    .daily-table-wrapper {
      max-height: 220px;
      overflow: auto;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #fff;
    }

    table.daily-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .daily-table thead {
      position: sticky;
      top: 0;
      background: #f0f0f0;
      z-index: 1;
    }

    .daily-table th,
    .daily-table td {
      padding: 4px 6px;
      border-bottom: 1px solid #eee;
      text-align: center;
      white-space: nowrap;
    }

    .daily-table th:first-child,
    .daily-table td:first-child {
      text-align: left;
    }

    .daily-table tr:nth-child(even) td {
      background: #fafafa;
    }

    .archive-controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:10px 0; }
    .archive-status { font-size:.78rem; color:#444; }
    .export-btn:disabled { opacity:.45; cursor:not-allowed; }
    @media (max-width: 420px) {
      .daily-table-wrapper { max-height: 180px; }
      .daily-table th,
      .daily-table td {
        padding: 3px 4px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="title">RECUENTO SEGUROS</div>

    <!-- BOTÓN PRESENTADO CON "-" -->
    <div class="presentado-container">
      <div class="presentado-wrapper">
        <div class="minus-btn" id="minus-presentado">−</div>
        <div class="presentado-btn" id="btn-presentado">
          <span class="count" id="count-presentado">0</span>
          <span class="label">Presentado</span>
        </div>
      </div>
    </div>

    <!-- RESTO DE BOTONES -->
    <div class="grid" id="buttons-grid"></div>

    <!-- BORRAR TODO -->
    <div class="actions-row">
      <button class="clear-btn" id="clear-btn">
        <div>Borrar</div>
        <div>todo</div>
      </button>
    </div>

    <!-- TOTALES -->
    <div class="totals">
      <div class="total-row">
        <div>Total unidades</div>
        <div class="total-box" id="total-unidades-box">0</div>
      </div>

      <div class="total-row">
        <div>Presentados</div>
        <div class="total-box" id="presentados-box">0</div>
      </div>

      <div class="total-row">
        <div>Objetivo</div>
        <div class="total-box" id="objetivo-box">+0</div>
      </div>
    </div>

    <!-- RESUMEN DIARIO -->
    <div class="daily-section">
      <div class="daily-header">
        <span class="month-label" id="month-label"></span>
        <button class="export-btn" id="export-btn">Exportar</button>
      </div>
      <div class="archive-controls">
        <button class="export-btn" id="previous-btn" type="button">Descarregar mes anterior</button>
        <span id="previous-status" class="archive-status"></span>
      </div>
      <div class="daily-table-wrapper">
        <table class="daily-table">
          <thead>
            <tr>
              <th>Día</th>
              <th>Total unidades</th>
              <th>Presentados</th>
              <th>Objetivo</th>
            </tr>
          </thead>
          <tbody id="daily-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
/* ---------- CONFIGURACIÓN ---------- */

// Botones "normales" (naranja)
const buttons = [
  { key: "noPresentado", label: "No presentado" },
  { key: "reserva",      label: "Reserva" },
  { key: "noLoQuiere",   label: "No lo quiere" },
  { key: "ticket",       label: "Ticket" },
  { key: "extranjero",   label: "Extranjero" },
  { key: "rescicion",    label: "Rescisión" },
  { key: "abono",        label: "Abono" },
  { key: "factura",      label: "Factura" },
  { key: "regalo",       label: "Regalo" }
];

const UNITS_KEYS     = ["presentado", ...buttons.map(b => b.key)];
const PRESENTED_KEYS = ["presentado"];

const STORAGE_KEY = "segurosCounter_v5";
const LEGACY_KEY = "segurosCounter_v4";
let state = { months: {}, exported: {} };

function todayDate() { return new Date(); }
function formatDateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function formatMonthId(d) { return formatDateKey(d).slice(0,7); }
function getCurrentMonthDays() {
  const d=todayDate(); return {year:d.getFullYear(),month:d.getMonth(),todayDay:d.getDate()};
}
function emptyCounts() {
  const obj={presentado:0}; buttons.forEach(b=>obj[b.key]=0); return obj;
}
function normalizeCounts(c) {
  const out=emptyCounts();
  for(const k of UNITS_KEYS) if(Number.isSafeInteger(c?.[k]) && c[k]>=0) out[k]=c[k];
  return out;
}
function normalizeMonth(m) {
  const daily={};
  if(m?.daily && typeof m.daily==="object") for(const [date,entry] of Object.entries(m.daily)) {
    if(/^\d{4}-\d{2}-\d{2}$/.test(date)) daily[date]={counts:normalizeCounts(entry?.counts)};
  }
  return {counts:normalizeCounts(m?.counts),daily};
}
function ensureMonth(id=formatMonthId(todayDate())) {
  if(!state.months[id]) state.months[id]={counts:emptyCounts(),daily:{}};
  return state.months[id];
}
function loadState() {
  try {
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw) {
      const parsed=JSON.parse(raw);
      if(parsed?.months && typeof parsed.months==="object") {
        state={months:{},exported:parsed.exported||{}};
        for(const [id,m] of Object.entries(parsed.months)) if(/^\d{4}-\d{2}$/.test(id)) state.months[id]=normalizeMonth(m);
      }
    } else {
      // Migrar sin eliminar el almacenamiento original.
      const old=localStorage.getItem(LEGACY_KEY);
      if(old) {
        const parsed=JSON.parse(old);
        if(/^\d{4}-\d{2}$/.test(parsed?.monthId||"")) state.months[parsed.monthId]=normalizeMonth(parsed);
      }
    }
  } catch(e) { console.warn("No se pudieron cargar los datos:",e); }
  ensureMonth();
  saveState();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
  catch(e) { alert("No se han podido guardar los datos. Comprueba el almacenamiento del navegador y exporta una copia."); }
}
function currentMonth() { return ensureMonth(); }
function ensureTodayDaily() {
  const month=currentMonth(), key=formatDateKey(todayDate());
  if(!month.daily[key]) month.daily[key]={counts:emptyCounts()};
  return month.daily[key].counts;
}
function syncMonth() {
  const id=formatMonthId(todayDate());
  if(!state.months[id]) { ensureMonth(id); saveState(); }
}
function previousMonthId() {
  const d=todayDate(); return formatMonthId(new Date(d.getFullYear(),d.getMonth()-1,1));
}
function updateArchiveControls() {
  const id=previousMonthId(), btn=document.getElementById("previous-btn"), status=document.getElementById("previous-status");
  const month=state.months[id];
  btn.disabled=!month;
  btn.textContent=`Descarregar ${new Date(Number(id.slice(0,4)),Number(id.slice(5,7))-1,1).toLocaleDateString("ca-ES",{month:"long",year:"numeric"})}`;
  status.textContent=!month?"No hi ha dades guardades d'aquest mes":state.exported[id]?"Ja descarregat (pots repetir)":"Pendent de descarregar";
}

/* ---------- CÁLCULOS ---------- */

function computeTotalsFromCounts(countsObj) {
  let totalUnits = 0;
  let presented = 0;

  UNITS_KEYS.forEach(k => {
    totalUnits += countsObj[k] || 0;
  });
  PRESENTED_KEYS.forEach(k => {
    presented += countsObj[k] || 0;
  });

  const objetivo = 2 * presented - totalUnits;
  return { totalUnits, presented, objetivo };
}

function computeMonthlyTotals() {
  return computeTotalsFromCounts(currentMonth().counts);
}

/* Cambia el color de fondo de la tarjeta según el objetivo */
function updateBackgroundByObjective() {
  const { objetivo } = computeMonthlyTotals();
  const app = document.querySelector(".app");
  if (!app) return;

  if (objetivo > 3) {
    app.style.backgroundColor = "var(--fondo-verde)";
  } else if (objetivo >= 0 && objetivo <= 3) {
    app.style.backgroundColor = "var(--fondo-naranja)";
  } else {
    app.style.backgroundColor = "var(--fondo-rosado)";
  }
}

/* ---------- RENDER BOTONES Y TOTALES ---------- */

function renderButtons() {
  const grid = document.getElementById("buttons-grid");
  grid.innerHTML = "";

  buttons.forEach(btn => {
    const card = document.createElement("div");
    card.className = "button-card";

    const row = document.createElement("div");
    row.className = "button-row";

    const minus = document.createElement("div");
    minus.className = "small-minus";
    minus.textContent = "−";
    minus.onclick = () => decrement(btn.key);

    const circle = document.createElement("div");
    circle.className = "circle-btn";
    circle.dataset.key = btn.key;
    const span = document.createElement("span");
    span.className = "count";
    span.textContent = currentMonth().counts[btn.key] || 0;
    circle.appendChild(span);
    circle.onclick = () => increment(btn.key);

    row.appendChild(minus);
    row.appendChild(circle);

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = btn.label;

    card.appendChild(row);
    card.appendChild(label);
    grid.appendChild(card);
  });
}

function renderTotals() {
  const { totalUnits, presented, objetivo } = computeMonthlyTotals();
  document.getElementById("total-unidades-box").textContent = totalUnits;
  document.getElementById("presentados-box").textContent = presented;

  const objBox = document.getElementById("objetivo-box");
  objBox.textContent = (objetivo >= 0 ? "+" : "") + objetivo;
  objBox.classList.toggle("ok", objetivo >= 0);
  objBox.classList.toggle("bad", objetivo < 0);

  document.getElementById("count-presentado").textContent =
    currentMonth().counts.presentado || 0;

  buttons.forEach(btn => {
    const el = document.querySelector(
      `.circle-btn[data-key="${btn.key}"] .count`
    );
    if (el) el.textContent = currentMonth().counts[btn.key] || 0;
  });

  updateBackgroundByObjective();
}

/* ---------- RENDER TABLA DIARIA ---------- */

function renderDailyTable() {
  const { year, month, todayDay } = getCurrentMonthDays();
  const tbody = document.getElementById("daily-tbody");
  tbody.innerHTML = "";

  const monthLabel = document.getElementById("month-label");
  const monthName = new Date(year, month, 1).toLocaleString("es-ES", {
    month: "long",
    year: "numeric"
  });
  monthLabel.textContent = `Resumen diario · ${monthName}`;

  for (let day = 1; day <= todayDay; day++) {
    const d = new Date(year, month, day);
    const key = formatDateKey(d);
    const dayCounts = currentMonth().daily[key]?.counts || emptyCounts();
    const { totalUnits, presented, objetivo } = computeTotalsFromCounts(dayCounts);

    const tr = document.createElement("tr");

    const tdDia = document.createElement("td");
    tdDia.textContent = day.toString().padStart(2, "0");

    const tdTotal = document.createElement("td");
    const tdPresentados = document.createElement("td");
    const tdObjetivo = document.createElement("td");

    tdTotal.textContent       = totalUnits;
    tdPresentados.textContent = presented;
    tdObjetivo.textContent    = (objetivo >= 0 ? "+" : "") + objetivo;

    tr.appendChild(tdDia);
    tr.appendChild(tdTotal);
    tr.appendChild(tdPresentados);
    tr.appendChild(tdObjetivo);

    tbody.appendChild(tr);
  }
}

/* ---------- ACCIONES ---------- */
function increment(key) {
  syncMonth(); const m=currentMonth();
  m.counts[key]++; ensureTodayDaily()[key]++;
  saveState(); renderTotals(); renderDailyTable(); updateArchiveControls();
}
function decrement(key) {
  syncMonth(); const m=currentMonth(), day=ensureTodayDaily();
  // No restar registros de otros días: así no se altera el histórico diario.
  if(!day[key]) return;
  day[key]--; m.counts[key]--;
  saveState(); renderTotals(); renderDailyTable(); updateArchiveControls();
}
function clearAll() {
  if(!confirm("¿Seguro que quieres borrar los datos del mes actual? Los meses anteriores se conservarán.")) return;
  state.months[formatMonthId(todayDate())]={counts:emptyCounts(),daily:{}};
  saveState(); renderButtons(); renderTotals(); renderDailyTable(); updateArchiveControls();
}
function exportMonth(id) {
  const m=state.months[id]; if(!m) return;
  const [year,month]=id.split("-").map(Number);
  const days=new Date(year,month,0).getDate();
  const isCurrent=id===formatMonthId(todayDate());
  const maxDay=isCurrent?todayDate().getDate():days;
  const header=["Fecha","Presentado",...buttons.map(b=>b.label),"Total unidades","Presentados","Objetivo"];
  const rows=[header.join(";")];
  for(let day=1;day<=maxDay;day++) {
    const date=`${id}-${String(day).padStart(2,"0")}`;
    const c=m.daily[date]?.counts||emptyCounts();
    const {totalUnits,presented,objetivo}=computeTotalsFromCounts(c);
    rows.push([date,c.presentado,...buttons.map(b=>c[b.key]||0),totalUnits,presented,objetivo].join(";"));
  }
  const blob=new Blob(["\ufeff"+rows.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob), link=document.createElement("a");
  link.href=url; link.download=`recuento_seguros_${id}.csv`;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  state.exported[id]=new Date().toISOString(); saveState(); updateArchiveControls();
}
function exportCSV() { syncMonth(); exportMonth(formatMonthId(todayDate())); }
function exportPrevious() { exportMonth(previousMonthId()); }

/* ---------- ARRANQUE ---------- */

function main() {
  loadState();
  renderButtons();
  renderTotals();
  renderDailyTable();
  updateArchiveControls();

  document.getElementById("btn-presentado").onclick   = () => increment("presentado");
  document.getElementById("minus-presentado").onclick = () => decrement("presentado");
  document.getElementById("clear-btn").onclick        = clearAll;
  document.getElementById("export-btn").onclick       = exportCSV;
  document.getElementById("previous-btn").onclick = exportPrevious;
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){syncMonth();renderTotals();renderDailyTable();updateArchiveControls();}});
  setInterval(()=>{const before=Object.keys(state.months).sort().at(-1);syncMonth();if(formatMonthId(todayDate())!==before){renderTotals();renderDailyTable();updateArchiveControls();}},60000);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  }
}

main();
</script>

</body>
</html>
